<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Tomatime</title>
<link rel="icon" href="favicon.png">
<style>
body { margin: 0; font: 1.1rem/1.6 system-ui, sans-serif; background: #d9322a; color: #fff; display: grid; place-items: center; min-height: 100vh; text-align: center; }
main { max-width: 26rem; padding: 0 1rem; }
img { width: 56px; image-rendering: pixelated; }
</style>
</head>
<body>
<!-- Sign in with Apple for Tomatime on Windows. Apple sends the browser here with the answer after the #;
     this page hands it to the Tomatime app waiting on this same PC (127.0.0.1) and nowhere else. Nothing is
     stored or sent to any server from here. windows/apple.js is the other half. -->
<main>
  <img src="tomato.png" alt="">
  <p id="t">Signing in…</p>
</main>
<script>
const answer = location.hash.slice(1), port = (new URLSearchParams(answer).get('state') || '').split('.')[0];
if (/^\d{4,5}$/.test(port) && answer.length < 8000) {
  location.replace('http://127.0.0.1:' + port + '/#' + answer);
} else {
  document.getElementById('t').textContent = 'This page finishes Sign in with Apple for Tomatime on Windows. Start from the Tomatime app.';
}
</script>
</body>
</html>
