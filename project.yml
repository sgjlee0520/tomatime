name: Tomatime
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
    watchOS: "11.0"
settings:
  base:
    DEVELOPMENT_TEAM: 976B3SJZGY
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "11"
    SWIFT_VERSION: "5.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.0.0
targets:
  Tomatime:
    type: application
    platform: macOS
    sources:
      - main.swift
      - Groups
      - Shared/TomatoTimer.swift
      - Assets.xcassets
      - path: GoogleService-Info.plist  # Firebase client config, kept out of git
        optional: true
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Tomatime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 Songgun Lee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sgjlee.tomatime
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        # Signing goes through TOMATIME_* so command-line overrides (release.sh, run-dev.sh) reach only this
        # target, not the Firebase package targets.
        TOMATIME_SIGN_IDENTITY: "-"  # ad-hoc for local builds
        TOMATIME_PROFILE: ""
        TOMATIME_ENTITLEMENTS: tools/Local.entitlements  # sandbox + network; signed builds use tools/Store.entitlements
        CODE_SIGN_IDENTITY: $(TOMATIME_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(TOMATIME_PROFILE)
        CODE_SIGN_ENTITLEMENTS: $(TOMATIME_ENTITLEMENTS)

  # iPhone app (same bundle id as the Mac app: one App Store record, universal purchase). Automatic signing.
  TomatimeiOS:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - path: GoogleService-Info.plist
        optional: true
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - target: TomatimeLive
      - target: TomatimeWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Tomatime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/TomatimeiOS.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.com.sgjlee.tomatime]  # the display setting, read by the Live Activity
    settings:
      base:
        PRODUCT_NAME: Tomatime
        PRODUCT_BUNDLE_IDENTIFIER: com.sgjlee.tomatime
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  # Live Activity: lock screen, Dynamic Island, Apple Watch Smart Stack.
  TomatimeLive:
    type: app-extension
    platform: iOS
    sources:
      - Live
      - Shared/TomatoTimer.swift
      - Shared/TomatoActivity.swift
      - Shared/TomatoStyle.swift
      - iOS/Assets.xcassets
    info:
      path: Live/Info.plist
      properties:
        CFBundleDisplayName: Tomatime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Live/TomatimeLive.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sgjlee.tomatime]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sgjlee.tomatime.live
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  # Apple Watch app, inside the iPhone app. No Firebase on watchOS: it talks to the shared timer through the phone.
  TomatimeWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared/TomatoTimer.swift
      - Shared/TomatoStyle.swift
      - Shared/WatchShared.swift
    dependencies:
      - target: TomatimeWatchWidget
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Tomatime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.sgjlee.tomatime
    entitlements:
      path: Watch/TomatimeWatch.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.sgjlee.tomatime]
    settings:
      base:
        PRODUCT_NAME: Tomatime
        PRODUCT_BUNDLE_IDENTIFIER: com.sgjlee.tomatime.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  # Watch-face complication with the countdown.
  TomatimeWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidget
      - Shared/TomatoTimer.swift
      - Shared/TomatoStyle.swift
      - Shared/WatchShared.swift
      - Watch/Assets.xcassets
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Tomatime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchWidget/TomatimeWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.sgjlee.tomatime]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sgjlee.tomatime.watchkitapp.widget
        CODE_SIGN_STYLE: Automatic
