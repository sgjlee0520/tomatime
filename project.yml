name: Tomatime
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  Tomatime:
    type: application
    platform: macOS
    sources: [main.swift, Assets.xcassets]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Tomatime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 Songgun Lee
    entitlements:
      path: Tomatime.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sgjlee.tomatime
        DEVELOPMENT_TEAM: 976B3SJZGY
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"  # local builds; tools/release.sh overrides for the store
