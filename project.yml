name: Tomatime
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.0.0
targets:
  Tomatime:
    type: application
    platform: macOS
    sources:
      - main.swift
      - Groups
      - Assets.xcassets
      - path: GoogleService-Info.plist  # Firebase client config, kept out of git
        optional: true
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Tomatime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 Songgun Lee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sgjlee.tomatime
        DEVELOPMENT_TEAM: 976B3SJZGY
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        # Signing goes through TOMATIME_* so command-line overrides (release.sh, run-dev.sh) reach only this
        # target, not the Firebase package targets.
        TOMATIME_SIGN_IDENTITY: "-"  # ad-hoc for local builds
        TOMATIME_PROFILE: ""
        TOMATIME_ENTITLEMENTS: tools/Local.entitlements  # sandbox + network; signed builds use tools/Store.entitlements
        CODE_SIGN_IDENTITY: $(TOMATIME_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(TOMATIME_PROFILE)
        CODE_SIGN_ENTITLEMENTS: $(TOMATIME_ENTITLEMENTS)
